<!DOCTYPE html>
<html lang="vi">

    <title>Danh Sách Người Dùng</title>

<body>
    <header>

        </nav>
    </header>

    <div class="container">
        <h2>Danh sách user</h2>
        <table>
            <thead>
                <tr>
                    <th>#</th>
                    <th>Username</th>
